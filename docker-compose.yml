services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soccer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soccer}
      POSTGRES_DB: ${POSTGRES_DB:-soccer_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - soccer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-soccer}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - soccer_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  soccer_postgres_data:
  soccer_redis_data:
