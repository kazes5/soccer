packages:
  - "apps/*"
  - "packages/*"

# Forces a patched nanoid regardless of what transitive dev-tooling deps
# (postcss, via next/vite/tailwind) would otherwise resolve — GHSA-2v37-7h3g-55p8,
# fixed upstream in 3.3.18. Not reachable from any of our own code (postcss's
# internal usage never passes size:0), but free to patch, so patch it.
#
# Forces a patched deepmerge-ts regardless of what prisma's own CLI tooling
# (@prisma/config) would otherwise resolve — GHSA-ggr8-5vv4-36mx (stack
# exhaustion merging recursive object graphs), fixed upstream in 8.0.0. Only
# reachable via local `prisma`/`@prisma/client` CLI config merging, not
# anything user-facing, but free to patch, so patch it.
#
# Forces a patched uuid regardless of what apps/load's `autocannon` (via its
# `hyperid` dependency) would otherwise resolve — GHSA-w5hq-g745-h8pq (missing
# buffer bounds check in v3/v5/v6 when a buffer is supplied), fixed upstream
# in 11.1.1. `hyperid` only uses uuid v4 (random, no buffer argument)
# internally, so not actually reachable here, but free to patch.
overrides:
  nanoid: '>=3.3.18'
  deepmerge-ts: '>=8.0.0'
  uuid: '>=11.1.1'

allowBuilds:
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - tsx@4.23.9
  - '@expo/cli@57.0.16'
  - '@expo/config@57.0.8'
  - '@expo/fingerprint@0.20.8'
  - '@expo/inline-modules@0.1.6'
  - '@expo/log-box@57.0.3'
  - '@expo/metro-runtime@57.0.11'
  - expo-asset@57.0.12
  - expo-constants@57.0.12
  - expo-router@57.0.14
  - expo-splash-screen@57.0.7
  - expo@57.0.14
  - expo-updates@57.0.15

# image-size <=2.0.2 (GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq): ICNS/JXL/HEIF
# parser infinite-loop DoS. Transitive via apps/mobile's Expo/Metro dev
# tooling only (expo > @expo/cli > ... > metro > image-size) — Metro's local
# dev bundler, never shipped to a production app bundle or reachable by an
# end user. No patched version exists yet (npm's `latest`/`legacy` dist-tags
# both predate the fix), so unlike the `overrides` above there is nothing to
# pin to; revisit once a fixed release is published.
auditConfig: { ignoreGhsas: [ 'GHSA-w3rx-r6r6-pgpr', 'GHSA-5p2g-fcmc-qvqq' ] }
